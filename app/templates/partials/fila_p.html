<tr>
  <td class="num">{{ '%.4f'|format(f.masa) }}</td>
  <td class="num">{{ f.n }}</td>
  <td class="num">{{ '%.2f'|format(f.t) }}</td>
  <td class="num">{{ '%.4f'|format(f.t_exp) if f.t_exp else '—' }}</td>
  <td class="num">{{ '%.4f'|format(f.t_teo) if f.t_teo else '—' }}</td>
  <td class="num">{{ '%.2f'|format(f.error) ~ ' %' if f.error is not none else '—' }}</td>
  <td style="white-space:nowrap">
    <button class="mini" hx-get="/datos/p/{{ f.id }}/editar" hx-target="closest tr" hx-swap="outerHTML">Editar</button>
    <button class="mini peligro" hx-delete="/datos/p/{{ f.id }}" hx-target="#tabla-p" hx-swap="outerHTML"
            hx-confirm="¿Borrar esta medición?">Borrar</button>
  </td>
</tr>
